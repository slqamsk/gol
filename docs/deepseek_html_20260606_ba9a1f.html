<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GOL - Дневной трекер</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="daily-tracker.css">
</head>
<body>
<div class="container">
    <header class="tracker-header">
        <h1>📅 Дневной трекер</h1>
        <div class="date-controls">
            <button id="select-day-btn" class="button">Выбрать день</button>
            <button id="today-btn" class="button">Сегодня</button>
        </div>
        <div id="current-date-display" class="current-date"></div>
    </header>

    <div id="status-box" class="status"></div>

    <div class="tracker-main">
        <div class="timeline-container">
            <div id="timeline" class="timeline"></div>
            <div id="activities-container" class="activities-container"></div>
        </div>
        <aside class="legend">
            <h3>Легенда</h3>
            <div id="legend-content"></div>
        </aside>
    </div>
</div>

<!-- Модальное окно выбора даты -->
<div id="date-modal" class="modal-overlay">
    <div class="modal-content">
        <h3>Выберите дату</h3>
        <div id="date-list" class="date-list"></div>
        <div class="modal-buttons">
            <button id="modal-select-btn" class="button">Выбрать</button>
            <button id="modal-cancel-btn" class="button secondary">Отмена</button>
        </div>
    </div>
</div>

<script src="daily-tracker.js"></script>
</body>
</html>
